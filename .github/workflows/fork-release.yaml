name: Fork Release
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref (branch/tag/SHA) to build from"
        required: true
        default: "feat/js-library-types-attribute-upstream"
      tag:
        description: "Release tag name"
        required: true
        default: "2025.40.171-cogna.2+types"
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
      - uses: bazel-contrib/setup-bazel@0.15.0
      - name: Build release artifacts
        working-directory: runner
        run: |
          mkdir assets
          for platform in linux_amd64_cgo linux_arm64_cgo darwin_arm64_cgo; do
            bazel run --run_under cp --platforms="@rules_go//go/toolchain:$platform" //:gazelle_prebuilt_bin "$PWD/assets/gazelle-$platform"
          done
          shasum -a 256 assets/* > assets/CHECKSUMS
      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          git tag "$TAG"
          git push origin "$TAG"
          cat > /tmp/release-notes.md <<'NOTES'
          Fork release adding types attribute support to js_library package targets.
          feat(js): generate types attribute on js_library package targets
          NOTES
          gh release create "$TAG" runner/assets/* \
            --title "$TAG" \
            --notes-file /tmp/release-notes.md
